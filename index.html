<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Флеш-картки для самопідготовки</title>
<style>
:root{--bg:#f6f5f0;--card:#fff;--text:#1c1c1a;--muted:#66655f;--line:#d9d6ca;--accent:#1f6f6b;--accent-t:#fff;--ok:#1b7a45;--okbg:#e2f3e8;--bad:#b3261e;--badbg:#fbe8e5;--sel:#e6f1f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171918;--card:#222524;--text:#ecebe6;--muted:#a3a29b;--line:#3a3e3c;--accent:#5fb8b2;--accent-t:#0f1a19;--ok:#6fd09a;--okbg:#17301f;--bad:#f2928b;--badbg:#3a1e1c;--sel:#1d3534}}
:root[data-theme="dark"]{--bg:#171918;--card:#222524;--text:#ecebe6;--muted:#a3a29b;--line:#3a3e3c;--accent:#5fb8b2;--accent-t:#0f1a19;--ok:#6fd09a;--okbg:#17301f;--bad:#f2928b;--badbg:#3a1e1c;--sel:#1d3534}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.35rem;margin:6px 0 4px;line-height:1.25}
.sub{color:var(--muted);margin:0 0 16px;font-size:.95rem}
#tabs{display:flex;gap:6px;margin-bottom:10px}
#tabs button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font:inherit;font-size:.95rem;cursor:pointer}
#tabs button.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
#stat{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.9rem;margin:6px 2px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
#card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px}
.q{font-size:1.08rem;font-weight:600;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;min-height:44px;margin:8px 0;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){background:var(--sel)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.exp{margin-top:14px;padding:12px;border-radius:10px;border:1px solid var(--line)}
.exp.ok{background:var(--okbg);border-color:var(--ok)}
.exp.bad{background:var(--badbg);border-color:var(--bad)}
.lr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.lr.ok{background:var(--okbg);border-color:var(--ok)}
.lr.bad{background:var(--badbg);border-color:var(--bad)}
.opts{margin:12px 0;padding:10px 12px;background:var(--bg);border-radius:10px}
.opts div{margin:3px 0}
select{min-height:40px;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:0 8px}
.btn{min-height:44px;padding:0 16px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-t);border-radius:10px;font:inherit;font-weight:600;cursor:pointer;margin:8px 8px 0 0}
.btn.alt{background:transparent;color:var(--accent)}
#nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:14px}
#nav .btn{margin:0;flex:1 1 auto}
.sol{margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:10px}
.done{text-align:center;color:var(--muted);margin-top:10px;font-size:.92rem}
sub,sup{line-height:0}
#tabs button{font-size:.82rem;padding:0 2px}
.tw{overflow-x:auto}
.rt{width:100%;border-collapse:collapse;margin:10px 0}
.rt th,.rt td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}
.rt tr.tot td{font-weight:700}
.q.sm{font-size:.95rem;margin:14px 0 4px}
.chips{display:flex;flex-wrap:wrap}
.chip{min-width:46px;min-height:40px;margin:3px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;font:inherit;font-size:.85rem;cursor:pointer}
.chip.ok{background:var(--okbg);border-color:var(--ok)}
.chip.bad{background:var(--badbg);border-color:var(--bad)}
.leg{margin:12px 0;font-size:.85rem;color:var(--muted)}
.leg .chip{display:inline-block;min-width:18px;width:18px;min-height:18px;height:18px;vertical-align:middle;margin:0 4px 0 10px;cursor:default}
.nm{display:block;font-size:.9rem;color:var(--muted);margin:6px 0 12px}
.nm input{display:block;width:100%;min-height:44px;margin-top:4px;padding:0 10px;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px}
#cpm{white-space:pre-line;text-align:left}
</style></head><body><div class="wrap">
<h1>Флеш-картки для самопідготовки</h1>
<p class="sub">60 карток для самоперевірки: тести, відповідність і задачі підвищеної складності.</p>
<div id="tabs"></div><div id="stat"></div><div class="bar"><i id="pb"></i></div>
<div id="card"></div><div id="nav"></div><div class="done" id="done"></div>
</div>
<script>
const D={"test": [{"f": "Яка область визначення функції y = log<sub>2</sub>(x − 3)?<br>А) x &gt; 0<br>Б) x &gt; 3<br>В) x ≥ 3<br>Г) x &lt; 3", "b": "<b>Відповідь: Б</b><br>Аргумент логарифма має бути додатним: x − 3 &gt; 0, тому x &gt; 3."}, {"f": "Чому дорівнює log<sub>3</sub>81?<br>А) 3<br>Б) 9<br>В) 27<br>Г) 4", "b": "<b>Відповідь: Г</b><br>3<sup>4</sup> = 81, тому log<sub>3</sub>81 = 4."}, {"f": "Обчисліть log<sub>2</sub>8 + log<sub>2</sub>4.<br>А) 5<br>Б) 12<br>В) 32<br>Г) 6", "b": "<b>Відповідь: А</b><br>3 + 2 = 5 (або log<sub>2</sub>32 = 5)."}, {"f": "Яке твердження правильне для функції y = log<sub>0,5</sub>x?<br>А) вона зростаюча<br>Б) вона парна<br>В) вона спадна<br>Г) вона періодична", "b": "<b>Відповідь: В</b><br>Основа 0 &lt; a &lt; 1, тому функція спадна на (0; +∞)."}, {"f": "Через яку точку проходить графік y = log<sub>a</sub>x за будь-якого допустимого a?<br>А) (0; 1)<br>Б) (a; 0)<br>В) (0; a)<br>Г) (1; 0)", "b": "<b>Відповідь: Г</b><br>log<sub>a</sub>1 = 0."}, {"f": "Розв’яжіть рівняння log<sub>2</sub>x = 5.<br>А) 10<br>Б) 25<br>В) 32<br>Г) 5/2", "b": "<b>Відповідь: В</b><br>За означенням x = 2<sup>5</sup> = 32."}, {"f": "Обчисліть log<sub>5</sub>1 + log<sub>5</sub>5.<br>А) 1<br>Б) 0<br>В) 5<br>Г) 6", "b": "<b>Відповідь: А</b><br>0 + 1 = 1."}, {"f": "Чому дорівнює lg 1000?<br>А) 2<br>Б) 3<br>В) 10<br>Г) 100", "b": "<b>Відповідь: Б</b><br>lg — логарифм за основою 10; 10<sup>3</sup> = 1000."}, {"f": "Обчисліть ln e².<br>А) e<br>Б) 2e<br>В) 1/2<br>Г) 2", "b": "<b>Відповідь: Г</b><br>ln e² = 2·ln e = 2."}, {"f": "Яка нерівність правильна?<br>А) log<sub>3</sub>5 &gt; log<sub>3</sub>4<br>Б) log<sub>2</sub>3 &lt; log<sub>2</sub>2<br>В) log<sub>0,5</sub>3 &gt; log<sub>0,5</sub>2<br>Г) lg 1 &gt; 0", "b": "<b>Відповідь: А</b><br>Основа 3 &gt; 1, функція зростає, тому з 5 &gt; 4 випливає log<sub>3</sub>5 &gt; log<sub>3</sub>4. В інших: Б) 3 &gt; 2, тож log<sub>2</sub>3 &gt; log<sub>2</sub>2; В) основа &lt; 1, функція спадна, нерівність хибна; Г) lg 1 = 0."}, {"f": "Чому дорівнює добуток log<sub>a</sub>b · log<sub>b</sub>a (a, b &gt; 0; a, b ≠ 1)?<br>А) 0<br>Б) a<br>В) 1<br>Г) ab", "b": "<b>Відповідь: В</b><br>З формули переходу до нової основи: log<sub>a</sub>b = 1 / log<sub>b</sub>a."}, {"f": "Розв’яжіть рівняння log<sub>3</sub>(x + 1) = 2.<br>А) 5<br>Б) 8<br>В) 7<br>Г) 9", "b": "<b>Відповідь: Б</b><br>x + 1 = 3² = 9, отже x = 8."}, {"f": "Обчисліть log<sub>2</sub>48 − log<sub>2</sub>3.<br>А) 45<br>Б) 16<br>В) 2<br>Г) 4", "b": "<b>Відповідь: Г</b><br>log<sub>2</sub>(48 : 3) = log<sub>2</sub>16 = 4."}, {"f": "Яка область значень функції y = log<sub>2</sub>x?<br>А) (−∞; +∞)<br>Б) (0; +∞)<br>В) [0; +∞)<br>Г) (1; +∞)", "b": "<b>Відповідь: А</b><br>Логарифмічна функція набуває всіх дійсних значень. (0; +∞) — її область визначення."}, {"f": "Яка формула переходу до нової основи c?<br>А) log<sub>a</sub>b = log<sub>c</sub>a / log<sub>c</sub>b<br>Б) log<sub>a</sub>b = log<sub>c</sub>b / log<sub>c</sub>a<br>В) log<sub>a</sub>b = log<sub>c</sub>b · log<sub>c</sub>a<br>Г) log<sub>a</sub>b = log<sub>c</sub>b − log<sub>c</sub>a", "b": "<b>Відповідь: Б</b><br>Логарифм числа за старою основою = (логарифм числа) / (логарифм старої основи) за новою основою."}, {"f": "Розв’яжіть рівняння lg(x − 1) = lg 4.<br>А) 3<br>Б) 4<br>В) 5<br>Г) 0", "b": "<b>Відповідь: В</b><br>x − 1 = 4, x = 5. Перевірка: 5 − 1 &gt; 0."}, {"f": "Яка функція є оберненою до y = 2<sup>x</sup>?<br>А) y = x²<br>Б) y = log<sub>x</sub>2<br>В) y = 1/2<sup>x</sup><br>Г) y = log<sub>2</sub>x", "b": "<b>Відповідь: Г</b><br>Показникова і логарифмічна функції з однаковою основою взаємно обернені."}, {"f": "Чому дорівнює log<sub>4</sub>2?<br>А) 1/2<br>Б) 2<br>В) 4<br>Г) 1/4", "b": "<b>Відповідь: А</b><br>4<sup>1/2</sup> = 2."}, {"f": "Знайдіть основу a, якщо log<sub>a</sub>8 = 3.<br>А) 3<br>Б) 2<br>В) 8/3<br>Г) 4", "b": "<b>Відповідь: Б</b><br>a³ = 8, отже a = 2."}, {"f": "Розв’яжіть нерівність log<sub>2</sub>x &gt; 3.<br>А) x &gt; 3<br>Б) x &gt; 6<br>В) x &gt; 8<br>Г) 0 &lt; x else if(cur==='match'){const m=pM(it),a=s.a[id]||(s.a[id]={sel:{},ch:false});
h=`<div class="q">${m.q}</div>`+m.L.map(x=>{const k=x[0],ok=a.ch&&a.sel[k]===m.key[k];return`<div class="lr ${a.ch?(ok?'ok':'bad'):''}"><span>${x}</span><select data-k="${k}" ${a.ch?'disabled':''}><option value="">—</option>${m.R.map(r=>`<option value="${r[0]}" ${a.sel[k]===r[0]?'selected':''}>${r[0]}</option>`).join('')}</select></div>`}).join('')+`<div class="opts">${m.R.map(r=>`<div>${r}</div>`).join('')}</div>`+(a.ch?`<div class="exp"><b>Правильні відповіді:</b> ${Object.keys(m.key).map(k=>k+'–'+m.key[k]).join(', ')}</div>`:`<button class="btn" id="chk">Перевірити</button>`)}
else{const a=s.a[id]||(s.a[id]={r:false,g:null});h=`<div class="q">${it.f}</div>`+(a.r?`<div class="sol">${it.b}</div>`+(a.g?`<div class="done">${a.g==='ok'?'Позначено: розв’язано.':'Позначено: потрібно повторити.'}</div>`:`<button class="btn" data-g="ok">Розв’язав(ла) правильно</button><button class="btn alt" data-g="again">Потрібно повторити</button>`):`<button class="btn" id="rev">Показати розв’язання</button>`)}
$('card').innerHTML=h;
$('nav').innerHTML=`<button class="btn alt" id="pv" ${s.i===0?'disabled':''}>← Назад</button><button class="btn alt" id="sh">Перемішати</button><button class="btn" id="nx" ${s.i===n-1?'disabled':''}>Далі →</button>`;
$('done').textContent=tot===n?'Ви пройшли всі картки цього розділу. Натисніть «Перемішати», щоб повторити.':'';
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=st[cur]||{o:[],a:{}},id=s.o[s.i];
if(b.dataset.t){cur=b.dataset.t;armed=false}
else if(b.dataset.go){const g=b.dataset.go.split(':');cur=g[0];st[cur].i=Math.max(0,st[cur].o.indexOf(+g[1]));window.scrollTo(0,0)}
else if(b.id==='cp'){copyRes();return}
else if(b.id==='rs'){if(armed){for(const k in S)st[k]={i:0,o:S[k].t.map((_,j)=>j),a:{}};armed=false}else armed=true}
else if(b.classList.contains('opt')&&!s.a[id]){s.a[id]=b.dataset.l}
else if(b.id==='chk'){s.a[id].ch=true}
else if(b.id==='rev'){s.a[id].r=true}
else if(b.dataset.g){s.a[id].g=b.dataset.g}
else if(b.id==='nx'){s.i=Math.min(s.i+1,s.o.length-1);window.scrollTo(0,0)}
else if(b.id==='pv'){s.i=Math.max(s.i-1,0);window.scrollTo(0,0)}
else if(b.id==='sh'){shuffle(cur);return}
else return;
render()});
document.addEventListener('change',e=>{if(e.target.dataset.k){const s=st[cur],id=s.o[s.i];s.a[id].sel[e.target.dataset.k]=e.target.value}});
let nm='',armed=false;
const SN={test:'Тест',match:'Відповідність',open:'Задачі'};
function stat(k){const s=st[k];return S[k].t.map((it,id)=>{const a=s.a[id];if(k==='test')return a?(a===pT(it).c?'ok':'bad'):'';if(k==='match'){if(!a||!a.ch)return'';const m=pM(it);return Object.keys(m.key).every(x=>a.sel[x]===m.key[x])?'ok':'bad'}return a&&a.g?(a.g==='ok'?'ok':'bad'):''})}
function sum(){return Object.keys(SN).map(k=>{const r=stat(k),d=r.filter(x=>x).length,g=r.filter(x=>x==='ok').length;return{k,r,n:r.length,d,g,p:d?Math.round(g/d*100):0}})}
function renderRes(){const A=sum(),D=A.reduce((x,a)=>x+a.d,0),G=A.reduce((x,a)=>x+a.g,0),N=A.reduce((x,a)=>x+a.n,0);
$('stat').innerHTML='';$('pb').style.width=(D/N*100)+'%';$('nav').innerHTML='';$('done').textContent='';
$('card').innerHTML=`<div class="q">Результати повторення</div><p class="sub">Результати не зберігаються й нікуди не надсилаються: вони лише на цій сторінці, доки вона відкрита. У розділі «Задачі» результат — ваша самооцінка.</p><label class="nm">Ім’я (необов’язково, лише для копії результату)<input id="nm" type="text" maxlength="60" value="${nm.replace(/"/g,'&quot;')}"></label><div class="tw"><table class="rt"><tr><th>Розділ</th><th>Опрацьовано</th><th>Правильно</th><th>% правильних</th></tr>${A.map(a=>`<tr><td>${SN[a.k]}</td><td>${a.d} з ${a.n}</td><td>${a.g}</td><td>${a.p}%</td></tr>`).join('')}<tr class="tot"><td>Разом</td><td>${D} з ${N}</td><td>${G}</td><td>${D?Math.round(G/D*100):0}%</td></tr></table></div><p class="sub">Натисніть номер картки, щоб повернутися до неї.</p>`+A.map(a=>`<div class="q sm">${SN[a.k]}</div><div class="chips">${a.r.map((x,i)=>`<button class="chip ${x}" data-go="${a.k}:${i}" aria-label="Картка ${i+1}: ${x==='ok'?'правильно':x==='bad'?'повторити':'не опрацьовано'}">${i+1}${x==='ok'?' ✓':x==='bad'?' ✗':''}</button>`).join('')}</div>`).join('')+`<div class="leg"><span class="chip ok"></span>правильно ✓<span class="chip bad"></span>повторити ✗<span class="chip"></span>не опрацьовано</div><button class="btn" id="cp">Копіювати результат</button><button class="btn alt" id="rs">${armed?'Підтвердити скидання':'Скинути все'}</button><div class="done" id="cpm"></div>`}
function copyRes(){const A=sum();const t='Флеш-картки для самопідготовки\n'+(nm?'Ім’я: '+nm+'\n':'')+A.map(a=>SN[a.k]+': опрацьовано '+a.d+' з '+a.n+', правильно '+a.g+' ('+a.p+'%)').join('\n');const m=$('cpm');
try{navigator.clipboard.writeText(t).then(()=>{m.textContent='Результат скопійовано. Його можна вставити в повідомлення вчителю.'},()=>{m.textContent=t})}catch(x){m.textContent=t}}
document.addEventListener('input',e=>{if(e.target.id==='nm')nm=e.target.value});
render();
</script></body></html>
